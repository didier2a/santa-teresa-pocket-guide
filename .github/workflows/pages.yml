name: Test and deploy Santa Teresa Pocket Guide

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check js/ar-core.js
          node --check js/pocketguide-v1-5.js
          node --check js/pocketguide-v1-5-proactive.js
          node --check js/planner-voice-v151.js
          node --check js/platform-v152.js
          node --check js/offline-v152.js
          node --check js/diagnostic-v152.js
          node --check js/route-runtime.js
          node --check js/route-library.js
          node --check engine/routepack.js
          node --check cloudflare/pocketguide-v2-worker.js
          node --check service-worker.js
          node --check js/pg16/core/event-bus.js
          node --check js/pg16/core/pocketguide-state.js
          node --check js/pg16/core/action-registry.js
          node --check js/pg16/core/context-engine.js
          node --check js/pg16/core/state-persistence.js
          node --check js/pg16/core/transaction-manager.js
          node --check js/pg16/core/proposal-manager.js
          node --check js/pg16/memory/memory-store.js
          node --check js/pg16/memory/route-memory.js
          node --check js/pg16/route/route-adapter-v15.js
          node --check js/pg16/route/route-actions.js
          node --check js/pg16/planner/planner-client.js
          node --check js/pg16/planner/planner-engine.js
          node --check js/pg16/platform/platform.js
          node --check js/pg16/perception/perception-engine.js
          node --check js/pg16/ar/geo-ar-engine.js
          node --check js/pg16/proactive/proactive-engine.js
          node --check js/pg16/ui/ui-actions.js
          node --check js/pg16/guide/human-guide.js
          node --check js/pg16/guide/voice-controller.js
          node --check js/pg16/guide/realtime-session.js
          node --check js/pg16/bootstrap/app-rc-entry.js
          node --check js/pg16/bootstrap/app-rc-bootstrap.js
          node --check js/pg17/guidance/walking-guidance-engine.js
          node --check js/pg17/simulation/walking-simulator.js
          node --check js/pg17/bootstrap/app-entry.js
          node --check js/pg17/bootstrap/app-enhancer.js
          node --check js/pg18/storage/itinerary-store.js
          node --check js/pg18/itineraries/itinerary-manager.js
          node --check js/pg18/backup/portable-backup.js
          node --check js/pg18/media/photo-capture.js
          node --check js/pg18/journal/audiovisual-journal.js
          node --check js/pg18/simulation/photo-preview-engine.js
          node --check js/pg18/bootstrap/app-entry.js
          node --check js/pg18/bootstrap/app-enhancer.js
          node --check js/pg2/core/v2-actions.js
          node --check js/pg2/core/session-store.js
          node --check js/pg2/companion/realtime-companion.js
          node --check js/pg2/companion/companion-orchestrator.js
          node --check js/pg2/bootstrap/app.js
      - name: V1.5.2 cross-platform regression tests
        run: |
          node --test tests/v1-5-unified-guide.test.mjs
          node --test tests/routepack-v1.test.mjs
          node --test tests/route-runtime-v1-1.test.mjs
          node --test tests/ar-core-v148.test.mjs
          node --test tests/schedule-engine.test.mjs
      - name: V1.6 Human Guide core tests
        run: node --test tests/pg16-core.test.mjs
      - name: V1.6 Premium UX RC tests
        run: node --test tests/pg16-ux-bridge.test.mjs
      - name: V1.6 RC1 transaction and memory gates
        run: node --test tests/pg16-rc1-core.test.mjs
      - name: V1.6 RC1 route-memory behavior gate
        run: node --test tests/pg16-route-memory.test.mjs
      - name: V1.6 Planner location replacement gate
        run: node --test tests/pg16-planner-location.test.mjs
      - name: V1.6 RC1 G0-G15 contract gates
        run: node --test tests/pg16-rc1-contract.test.mjs
      - name: V1.6 RC1 G14 simulation matrix
        run: node --test tests/pg16-rc1-simulation.test.mjs
      - name: V1.7 audiovisual guidance gates
        run: node --test tests/pg17-*.test.mjs
      - name: V1.8 local itinerary and journal gates
        run: node --test tests/pg18-*.test.mjs
      - name: V2 companion operating-system gates
        run: node --test tests/pg2-*.test.mjs
      - name: Complete repository regression suite
        run: node --test tests/*.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
