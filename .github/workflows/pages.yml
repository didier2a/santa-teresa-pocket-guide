name: Test and deploy Santa Teresa Pocket Guide

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check js/ar-core.js
          node --check js/pocketguide-v1-5.js
          node --check js/pocketguide-v1-5-proactive.js
          node --check js/planner-voice-v151.js
          node --check js/platform-v152.js
          node --check js/offline-v152.js
          node --check js/diagnostic-v152.js
          node --check js/route-runtime.js
          node --check js/route-library.js
          node --check engine/routepack.js
          node --check cloudflare/pocketguide-v2-worker.js
          node --check service-worker.js
          node --check js/pg16/core/event-bus.js
          node --check js/pg16/core/pocketguide-state.js
          node --check js/pg16/core/action-registry.js
          node --check js/pg16/core/context-engine.js
          node --check js/pg16/route/route-adapter-v15.js
          node --check js/pg16/route/route-actions.js
          node --check js/pg16/ui/ui-actions.js
          node --check js/pg16/guide/human-guide.js
          node --check js/pg16/bootstrap/app-bootstrap.js
      - name: V1.5.2 cross-platform regression tests
        run: |
          node --test tests/v1-5-unified-guide.test.mjs
          node --test tests/routepack-v1.test.mjs
          node --test tests/route-runtime-v1-1.test.mjs
          node --test tests/ar-core-v148.test.mjs
          node --test tests/schedule-engine.test.mjs
      - name: V1.6 Human Guide core tests
        run: node --test tests/pg16-core.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
