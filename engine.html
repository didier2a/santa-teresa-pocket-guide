<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#103f4a">
  <title>PocketGuide Engine</title>
  <style>html,body{margin:0;min-height:100%;background:#06171c;color:#fff;font-family:system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center}.boot strong{font-size:1.35rem}.boot small{display:block;margin-top:10px;opacity:.7}</style>
</head>
<body>
  <div class="boot"><div><strong>PocketGuide Engine</strong><small>Chargement et validation du parcours…</small></div></div>
  <script>
  (async()=>{
    try{
      const response=await fetch('./index.html',{cache:'no-store'});
      if(!response.ok)throw new Error('Interface PocketGuide indisponible');
      let html=await response.text();
      const marker='<script type="module" src="js/app.js"><'+'/script>';
      const injected='<script src="js/route-bootstrap.js"><'+'/script>\n  '+marker;
      if(!html.includes(marker))throw new Error('Point de démarrage PocketGuide introuvable');
      html=html.replace(marker,injected);
      document.open();document.write(html);document.close();
    }catch(error){
      document.body.innerHTML='<div class="boot"><div><strong>Impossible de charger PocketGuide</strong><small>'+String(error.message||error)+'</small></div></div>';
    }
  })();
  </script>
</body>
</html>
